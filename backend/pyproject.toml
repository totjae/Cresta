[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cresta-backend"
version = "0.1.0"
description = "Cresta FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "holidays==0.102",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyotp>=2.9,<3",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
cresta-admin = "app.cli:main"
cresta-worker = "app.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "postgresql: tests that require the isolated Phase 10G.1 PostgreSQL acceptance database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    secrets:
      - kiwoom_mock_app_key
      - kiwoom_mock_app_secret
      - kiwoom_mock_account_id
    environment:
      CRESTA_KIWOOM_ENABLED: "true"
      CRESTA_KIWOOM_APP_KEY_FILE: /run/secrets/kiwoom_mock_app_key
      CRESTA_KIWOOM_APP_SECRET_FILE: /run/secrets/kiwoom_mock_app_secret
      CRESTA_KIWOOM_ACCOUNT_ID_FILE: /run/secrets/kiwoom_mock_account_id
      CRESTA_LLM_SECRET_DIRECTORY: /run/cresta-llm-secrets
    volumes:
      - ../secrets/llm:/run/cresta-llm-secrets
  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["cresta-worker", "kiwoom"]
    env_file: [.env]
    environment:
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      CRESTA_KIWOOM_ENABLED: "true"
      CRESTA_KIWOOM_APP_KEY_FILE: /run/secrets/kiwoom_mock_app_key
      CRESTA_KIWOOM_APP_SECRET_FILE: /run/secrets/kiwoom_mock_app_secret
      CRESTA_KIWOOM_ACCOUNT_ID_FILE: /run/secrets/kiwoom_mock_account_id
    secrets:
      - postgres_password
      - kiwoom_mock_app_key
      - kiwoom_mock_app_secret
      - kiwoom_mock_account_id
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    networks: [backend]
    logging: *default-logging
  scheduler:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["cresta-worker", "scheduler"]
    env_file: [.env]
    environment:
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]
    logging: *default-logging
  agent:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["cresta-worker", "agent"]
    env_file: [.env]
    environment:
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      CRESTA_LLM_SECRET_DIRECTORY: /run/cresta-llm-secrets
    volumes:
      - ../secrets/llm:/run/cresta-llm-secrets:ro
    secrets:
      - postgres_password
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]
    logging: *default-logging
  sourced-handoff:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["cresta-worker", "sourced-handoff"]
    env_file: [.env]
    environment:
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      migration:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]
    logging: *default-logging

secrets:
  kiwoom_mock_app_key:
    file: ../secrets/kiwoom_mock_app_key
  kiwoom_mock_app_secret:
    file: ../secrets/kiwoom_mock_app_secret
  kiwoom_mock_account_id:
    file: ../secrets/kiwoom_mock_account_id

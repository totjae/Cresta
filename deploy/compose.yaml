name: cresta

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cresta
      POSTGRES_USER: cresta
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cresta -d cresta"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    cpus: 1.5
    networks: [backend]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    cpus: 0.5
    networks: [backend]
    logging: *default-logging

  migration:
    build:
      context: ../backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      CRESTA_TOTP_ENCRYPTION_KEY_FILE: /run/secrets/totp_encryption_key
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      CRESTA_ARTIFACT_ROOT: /var/lib/cresta-artifacts
    volumes:
      - ../artifacts:/var/lib/cresta-artifacts:ro
    secrets:
      - totp_encryption_key
      - postgres_password
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    networks: [backend]
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    networks: [backend]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:7788:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]
    logging: *default-logging

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  totp_encryption_key:
    file: ../secrets/totp_encryption_key

networks:
  backend: {}

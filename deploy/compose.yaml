name: cresta

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cresta
      POSTGRES_USER: cresta
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cresta -d cresta"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    cpus: 1.5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    cpus: 0.5
    networks: [backend]

  api:
    build:
      context: ../backend
    restart: on-failure:3
    env_file: [.env]
    environment:
      CRESTA_TOTP_ENCRYPTION_KEY_FILE: /run/secrets/totp_encryption_key
      CRESTA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - totp_encryption_key
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    networks: [backend]

  frontend:
    build:
      context: ../frontend
    restart: on-failure:3
    depends_on: [api]
    mem_limit: 512m
    cpus: 0.5
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, frontend]
    ports:
      - "127.0.0.1:7788:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  totp_encryption_key:
    file: ../secrets/totp_encryption_key

networks:
  backend: {}

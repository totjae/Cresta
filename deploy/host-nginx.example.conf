server {
    listen 80;
    server_name trade.mihoservice.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trade.mihoservice.xyz;

    # 실제 인증서 경로는 서버의 인증서 발급 도구에 맞춰 설정한다.
    ssl_certificate /etc/letsencrypt/live/trade.mihoservice.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.mihoservice.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }
}
